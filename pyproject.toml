[project]
name = "jobagent"
version = "0.1.0"
description = "LinkedIn job discovery agent POC (milestone 1: alert ingest + store)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "typer", "beautifulsoup4"]

[project.optional-dependencies]
gmail = ["google-api-python-client", "google-auth-oauthlib"]
browser = ["playwright"]
dev = ["pytest"]

[project.scripts]
jobagent = "jobagent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
